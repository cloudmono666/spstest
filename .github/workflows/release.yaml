name: Release
run-name: >-
  ${{
    github.event_name == 'issue_comment'
      && format('[Snapshot] Release by {0}', github.actor)
    || format('[Production] Release from {0}', github.ref_name)
  }}

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && format('issue-{0}-{1}', github.event.issue.number, github.actor) || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    if: github.event_name == 'push' && github.repository == 'cloudmono666/spstest'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # PAT so pushes from changesets/action fire `synchronize` events
          # and CI re-runs on Release-PR updates.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Upgrade npm for trusted publishing
        run: npx npm@11 install -g npm@11

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          commit: 'Version Packages'
          title: 'Version Packages'
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  snapshot-release:
    name: Snapshot release
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '!snapshot') &&
      github.repository == 'cloudmono666/spstest'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Limit to repo collaborators
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
            } catch (e) {
              core.setFailed(`@${context.actor} is not a collaborator on ${context.repo.owner}/${context.repo.repo}`);
            }

      - name: Validate PR source and freshness
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              core.setFailed('Snapshots are restricted to branches within this repo.');
              return;
            }

            const commentCreated = new Date(context.payload.comment.created_at);
            const prLastUpdated = new Date(pr.updated_at);

            if (prLastUpdated > commentCreated) {
              core.setFailed('The PR has been updated since !snapshot was initiated. Re-run !snapshot after review.');
            }

      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
          fetch-depth: 1

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Upgrade npm for trusted publishing
        run: npx npm@11 install -g npm@11

      - name: Install Dependencies
        run: pnpm install

      - name: Extract snapshot name
        id: snapshot-name
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.comment.body.match(/!snapshot\s*(\S*)/);
            const name = (match && match[1] && match[1].trim()) || 'snapshot';
            if (!/^[a-z]+(-[a-z]+)*$/.test(name)) {
              core.setFailed(`Invalid snapshot name: "${name}". Use kebab-case.`);
            }
            core.setOutput('name', name);

      - name: Force-patch changeset
        run: |
          find .changeset -name "*.md" ! -name "README.md" -delete
          cat > .changeset/snapshot.md <<'EOF'
          ---
          'spstest-1': patch
          'spstest-2': patch
          ---

          Snapshot release.
          EOF

      - name: Bump versions for snapshot
        run: pnpm changeset version --snapshot ${{ steps.snapshot-name.outputs.name }}

      - name: Publish snapshot
        run: pnpm changeset publish --tag ${{ steps.snapshot-name.outputs.name }} --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: React to triggering comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

      - name: Comment on PR with install info
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.snapshot-name.outputs.name }}';
            const lines = ['spstest-1', 'spstest-2'].map((name) => {
              const pkg = JSON.parse(fs.readFileSync(`packages/${name}/package.json`, 'utf8'));
              return `\`${pkg.name}\`\n\`\`\`sh\nnpm i ${pkg.name}@${pkg.version} --save-exact\n\`\`\``;
            });
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Snapshot \`${tag}\` published:\n\n${lines.join('\n\n')}`,
            });
