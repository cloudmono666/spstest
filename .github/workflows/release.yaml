name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: |
          NPM_DIR="$HOME/.npm-latest"
          npm install --prefix "$NPM_DIR" npm@latest
          echo "$NPM_DIR/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify npm version
        run: |
          which npm
          npm --version
          echo "OIDC URL set:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - name: Install Dependencies
        run: pnpm install

      - name: Create Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'Version Packages'
          title: 'Version Packages'
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e
          for pkg in packages/*/; do
            cd "$GITHUB_WORKSPACE/$pkg"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo ">>> $NAME@$VERSION already published, skipping"
            else
              echo ">>> Publishing $NAME@$VERSION"
              npm publish --access public
            fi
          done
          cd "$GITHUB_WORKSPACE"
          pnpm changeset tag
          git push --follow-tags
